              along the inward contact normal, a 5 x 5 grid at +/-6 mm, against every
              other part at the nominal pose (cad/m10/shell_clearance.py, artifacts/m10/cad/shell_clearance.json).
              Spots and inward normals are in the struck part''s link frame, from
              the sideways falls run without the backing; the thighs'' second spot
              is where the M11 plant''s sideways_rest strike landed outside the first
