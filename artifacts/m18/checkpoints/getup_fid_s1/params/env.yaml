            stop is in the CAD (D4 arc slot, m10.internals.knee_stop), the thigh_a1
            and knee_drive_a2 stops too (D4 hidden arc slots, m10.internals.end_stops)
        bumpers:
          enabled: true
          status: 'Phase D4 adopted (user decisions 13 October 2026), in the D4 CAD:
            LD45 foam behind a 1 mm TPU 88A wear skin, mounted on the chassis frame
            (skid, screwed through the tub floor into the bulkhead feet; it also retains
            the battery hatch, so it comes off for a battery swap) or the wheel hub
            (rings, on a PA12 carrier in the hub recess), so the load bypasses the
            printed shells; flexible TPU 88A ears with a three-screw root retention'
          foam: ld45_upper
          stiffness_scale: 1.0
          stiffness_scale_range:
          - 0.5
          - 4.0
          skin_thickness_m: 0.0012
          skin_basis: 'TPU 88A cup over the ground face and sides of each pad, 1.2
            mm: above the 1.0 mm printed-wall screen (cad/m10/manufacturability.py).
            The plant neglects the skin in series with the foam'
          max_strain: 0.5
          max_strain_basis: End of the supplier compression curve (Zotefoams LD45
            25 and 50 percent values); beyond it the densification term is an assumption,
            so a peak strain above 0.5 is reported as bottoming
          skid:
            size_m:
            - 0.13
            - 0.08
            - 0.01
            center_x_m: -0.01
            end_bevel_deg: 12.5
            flat_length_m: 0.07
            basis: Keel under the tub centreline, 10 mm proud of the tub floor; long
              enough that the tub ends stay clear at the 12-13 deg belly-strike pitch
          wheel_ring:
            outer_radius_m: 0.031
            inner_radius_m: 0.021
            thickness_m: 0.01
            dome_deg: 12.0
            basis: Annulus on each wheel's outer face, outboard of the tire; 5 mm
              inside the 36 mm tire radius so it clears the floor below about 27 deg
              of roll
          ear:
            material: tpu
            elongation_at_break_Z: 1.3
            strain_knockdown: 0.6
            source: https://forward-am.com/wp-content/uploads/2021/04/BASF_3DPS_TDS_Ultrasint-TPU-88A.pdf
            basis: 'BASF Ultrasint TPU 88A TDS 2.2 (08/2021): elongation at break
              130 percent (Z), 270 percent (XY); flexural modulus 70 MPa. The ear
              is a root-fixed cantilever of the CAD length, width and thickness; root
              bending strain 3 t d / (2 L^2) at tip deflection d'
            retention:
              name: ear_root_screws
              count: 6
              thread: M2
              length_m: 0.006
              washers_per_screw: 1
              parent_material: pa12
              thread_engagement_m: 0.004
              edge_center_distance_m: 0.003
              member_thickness_m: 0.003
              tab_thickness_m: 0.003
              per_interface: 3
              bolt_spacing_m: 0.024
              fit: 'Three M2 x 6 per ear, 12 mm pitch (outer pair 24 mm apart), through
                a 3 mm TPU root tab into SPIROL M2 heat-set inserts in a 3 mm local
                boss inside the head pod side wall (D4 CAD: the boss; the screws and
                inserts are in the fastener allowance). Phase D4: two screws in the
                2 mm wall gave shear factor 1.04 (PA12 bearing 101 N)'
          mass_estimate_kg:
            wheel_rings: 0.0052
            skid: 0.0057
            tpu_ears_increase: 0.0021
            ear_screws_and_inserts: 0.0033
            ear_root_bosses: 0.0004
            basis: LD45 47 kg/m3 foam volumes plus 1 mm TPU 88A (1100 kg/m3) skins;
              TPU ears at the CAD ear volume (PA12 11.6 g at 930 kg/m3); M2 x 6 screws
              and SPIROL inserts
        end_stop_pads:
          status: 'Phase D stop features: a TPU pad on one member strikes the other
            at each end of each range. The knee_angle stop is in the CAD as the D4
            arc slot (m10.internals.knee_stop: shin steel pin in a thigh-lid groove
            with a TPU pad at each end, 14.5 mm radius); the thigh_a1 and knee_drive_a2
            stops are in the CAD as the D4 hidden arc slots (m10.internals.end_stops:
            steel dowels on the body in padded grooves in the 80T hip pulleys, 20
            mm radius; were plant-only pads at 10 mm, 48 mm2, 4 mm before 18 October
            2026)'
          basis: Winkler pad M = E A r^2 theta / t over the overtravel theta, the
            TPU 88A tensile modulus as the compliance proxy (contact materials); beyond
            max_strain the pad bottoms onto the PA12 backing (E A r^2 / backing_thickness
            added). Damping from the contact restitution with the joint's exact effective
            inertia. Mapped through the solver row diagonal like the material contacts;
            exceeding max_strain is reported, never clipped.
