        status: Phase C free-base serial-leg digital plant (bipe/m10/plant.py). Validated-simulation
          target under the stated assumptions; nothing here is hardware-validated.
        units: SI
        simulation:
          physics_dt: 0.00025
          control_dt: 0.005
          joint_servo_dt: 0.001
          log_dt: 0.01
          noslip_iterations: 5
          basis: M9 plant timing (m9_physics.simulation)
        hip_motor:
          model: CubeMars RO40 KV140 Lite, four per robot, each through a 4:1 2GT
            belt (20T to 80T)
          ratio: 4.0
          efficiency_screen: 0.9
          peak_torque_motor_Nm: 0.6
          continuous_torque_motor_Nm: 0.2
          no_load_speed_motor_rad_s: 356.0471674068432
          rotor_core_inertia_kg_m2: 1.2211e-05
          rotor_mass_kg_assumption: 0.026
          torque_constant_Nm_A: 0.068
          rated_current_A: 2.85
          peak_current_A: 11.6
          FOC_time_constant_s: 0.0007957747154594767
          FOC_current_slew_limit_A_s: 10000.0
          viscous_motor_Nm_s_rad: 2.0e-05
          coulomb_motor_Nm: 0.002
          normal_command_cap_Nm: 1.65
          basis: Same motor, belt reduction, current curve, FOC lag and command cap
            as m9_physics.motor (manufacturer data; friction values are M9 screening
            assumptions). Rotor mass is the M9 assumption (m9_cad rotor_mass_kg_assumption).
        hub_motor:
          model: CubeMars GL40 KV70 gimbal motor, direct drive in each wheel hub
          torque_constant_Nm_A: 0.15
          rated_torque_Nm: 0.25
          peak_torque_Nm: 0.5
          rated_current_A: 1.62
          peak_current_A: 3.3
          phase_to_phase_resistance_ohm: 4.5
          phase_to_phase_inductance_H: 0.0018
          rated_voltage_V: 16.0
          no_load_speed_rpm_at_rated_voltage: 1015
          back_emf_V_s_rad: 0.15053078361400937
          back_emf_basis: Rated voltage over the no-load speed (16 V / 1015 rpm);
            the catalog Ke of 15 V/krpm gives 0.143
          rotor_inertia_kg_m2: 7.4e-06
          drive_voltage_limit_V: 18.24
          drive_voltage_basis: 'M11 phase D (user decision 18 October 2026): bus limit
            at the low pack, 0.95 x 19.2 V (the 0.95 modulation limit is an assumption
            to check against the moteus firmware). moteus has no output-voltage cap
            (servo.max_voltage is an input over-voltage fault) and CubeMars lists
            16 V as the GL40 rated voltage with no maximum. Motoring current is limited
            to (V - Ke w) / R_hot and to the peak current; braking current to the
            peak current.'
          voltage_limit_winding_temperature_C: 80.0
          copper_resistance_tempco_per_C: 0.00393
          lead_resistance_ohm: 0.09
          voltage_limit_resistance_basis: R_hot = R_20C (1 + 0.00393 (80 - 20)) +
            leads. 80 C bounds the hubs' duty (mean copper loss at most 0.64 W in
            the phase A cases); leads are the thin-wall PTFE 26 AWG phase pair over
            about 0.32 m (docs/milestones/11-electronics-plan.md, phase D harness
            findings)
          FOC_time_constant_s: 0.0007957747154594767
          FOC_current_slew_limit_A_s: 10000.0
          basis: CubeMars GL40 KV70 product data; FOC lag and slew as for the RO40
            (moteus 200 Hz current bandwidth)
        belts:
          hip_stiffness_Nm_rad: 349.969332521916
          hip_stiffness_range_Nm_rad:
          - 118.88772316024904
          - 713.3263389614942
          knee_stiffness_Nm_rad: 69.14013424161588
          knee_stiffness_range_Nm_rad:
          - 23.487860581218918
          - 140.9271634873135
          hip_lash_deg: 0.25
          hip_lash_range_deg:
          - 0.1125
          - 0.45
          knee_lash_deg: 0.5
          knee_lash_range_deg:
          - 0.225
          - 0.9
          hip_damping_Nm_s_rad: 0.029164111043492997
          knee_damping_Nm_s_rad: 0.005761677853467823
          hip_pretension_per_span_N: 62.5
          hip_pretension_basis: 'Phase D4 (user decisions 13 October 2026): 60 ->
            62.5 N per span. At 60 N the forward_0p3 thigh hip-belt slack path fell
            to factor 1.98 at dt/2 with the knee stop B thigh; 65 N was tried first
            and dipped the hip pod bearing to 1.68 at dt/2 (the skid strike peak is
            trajectory sensitive, 250-469 N), so 62.5 N was adopted after it kept
            factor 2 in all five forward_0p3 ensemble runs (slack 2.06-2.33). Gates
            Light Power & Precision manual p65: Formula 1 (1.21 Q/d) gives 57 N; Table
            8 general static tension for 2MGT GT3 6 mm is 10 lb (44 N) per span, and
            registration (positioning) drives start at 1.5-2.0 x Table 8 (67-89 N);
            Table 6 rated working tension at 20 grooves 39 lb (173 N), breaking strength
            125 lb. The extra pull raises the hip bearings'' pretension load by 4
            percent (in the plant''s bearing friction and the falls screen).'
          basis: 'M9 Gates basis: Table 6 2MGT 6 mm cord EA proxy 16903 N (9 mm: x1.5),
            two spans, k = 2 EA r^2 / span at the output pulley. Hip (20T:80T, 2MR-192
            96T belt, 41.53 mm centres, 36.9 mm span; phase D4 14 October 2026, was
            95T at 40.5 mm): cord 594.4 N m/rad. Knee (40T:40T, 70 mm centres): cord
            117.4 N m/rad. Range 0.2..1.2 x cord and nominal 0.589 x cord, both as
            adopted in M9. Lash: the M9 tangential lash 0.05..0.2 mm (nominal 0.11
            mm) at each output pulley radius. Damping keeps the M9 hip belt time constant
            (0.025 / 300 s). Pretension per span is the M9 value. All assumptions
            until a drive is measured.'
          source: https://www.gates.com/content/dam/documents-library/catalogs/light-power-and-precision-manual.pdf
        friction:
          ball_bearing_mu: 0.0015
          ball_bearing_basis: SKF simplified frictional moment M = 0.5 mu P d for
            deep groove ball bearings (mu 0.0015); hip 6704 at its 20 mm bore; the
            knee-drive joint's 688A inner-shaft bearings (8 mm bore) are lumped at
            the same 20 mm bore, which overstates their small moment (about 2 vs 0.8
            mN m at the pretension load); knee 6800 at 10 mm
          hip_bearing_bore_m: 0.02
          knee_bearing_bore_m: 0.01
          hip_viscous_Nm_s_rad: 0.001
          knee_viscous_Nm_s_rad: 0.0005
          knee_bearing_coulomb_Nm: 0.001
          wheel_viscous_Nm_s_rad: 0.0003
          wheel_coulomb_Nm: 0.004
          basis: Viscous and constant Coulomb terms are M9 screening assumptions (GL40
            drag and cogging unmeasured). Belt loss (1 - 0.9) x |belt torque| acts
            on each belt's driven member.
        contact:
          solref_s:
          - 0.003
          - 1.0
          solimp:
          - 0.95
          - 0.99
          - 0.001
          material_source: config/m9-impact-materials.json
          geometry: Convex hulls of the B3 printed exterior parts in their link frames
            (artifacts/m10/assembly/render-mesh.json.gz, nominal pose); the tire is
            a 72 x 28 mm cylinder. Hulls fill concave pockets.
          basis: 'M9 material-contact machinery and Coulomb friction rows (config/m9-impact-materials.json
            contacts). Tire: solid SLS TPU 88A as a Winkler layer of the 10 mm tire
            section with the tensile modulus as a compliance proxy; knob relief neglected.
            Exterior: the M9 PA12 shell strip law. Locomotion contact assumptions,
            not a fall qualification.'
          shell_backing:
            basis: 'Measured interior clearance (phase D4, user decision 17 October
              2026). The M9 shell strip law puts a metal backing at its 4 mm travel
              assumption (config/m9-impact-materials.json contacts.shell_maximum_travel_m_assumption).
              At the two sideways strike spots the backing is placed at the gap measured
              in the CAD instead: a FreeCAD ray-cast from the struck outer surface
              along the inward contact normal, a 5 x 5 grid at +/-6 mm, against every
              other part at the nominal pose (cad/m10/shell_clearance.py, artifacts/m10/cad/shell_clearance.json).
              Spots and inward normals are in the struck part''s link frame, from
              the sideways falls run without the backing; the thighs'' second spot
              is where the M11 plant''s sideways_rest strike landed outside the first
              (phase D step 6, user decision 19 October 2026). Each value is the smallest
              thin-wall gap on the grid, rounded down to 0.1 mm, so it holds only
              within radius_m of a listed spot; the falls fail a strike past the default
              travel outside it.'
            radius_m: 0.006
            parts:
              BodyTub:
                travel_m: 0.0076
                spots_m:
                - - 0.0614
                  - 0.0466
                  - -0.0307
                - - 0.0614
                  - -0.0466
                  - -0.0307
                inward_normals:
                - - -0.852
                  - -0.518
                  - 0.078
                - - -0.852
                  - 0.518
                  - 0.078
                obstacle: the tub's own screw column (7.6 mm); battery about 32 mm
                strike: front-lower vertical edge, sideways_0p3
              left_Thigh:
                travel_m: 0.0063
                spots_m:
                - - 0.08456
                  - 0.06127
                  - 0.01485
                - - 0.08924
                  - 0.06125
                  - 0.00805
                inward_normals:
                - - -0.69
                  - 0.117
                  - -0.714
                - - -0.91
                  - 0.112
                  - -0.399
                obstacle: the thigh's far wall at the knee-stop boss edge (6.65 mm)
                  and the knee belt (7.2 mm) at the first spot; the knee belt (6.34
                  mm) at the second; rays through the solid boss itself are excluded
                strike: knee end, sideways_rest; the second spot is the M11 plant's
                  strike (phase D step 6, user decision 19 October 2026)
              right_Thigh:
