[platformio]
src_dir = src
include_dir = include
build_dir = build/platformio

[env:teensy40]
platform = teensy@5.0.0
board = teensy40
framework = arduino
platform_packages =
    platformio/framework-arduinoteensy@1.159.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.110301.0
    platformio/tool-teensy@1.162.0
build_flags = -Wall -Wextra
build_src_filter = +<protocol.c> +<supervisor.c> +<balance.c> +<estimator.c> +<kinematics.c> +<follower.c> +<application/application.c> +<policy/power_policy.c> +<integration/runtime.c> +<startup/startup_monitor.c> +<teensy_main.cpp>

; M11 bench image (make teensy-m11): CAN3 CAN-FD to the moteus drivers and the LSM6DSO,
; compiled against the M10 generated_config.h in build/m11-config; torque path locked.
; Links the M13 forward pass and parity vectors: run python -m bipe.m13.export first.
[env:teensy40_m11]
platform = teensy@5.0.0
board = teensy40
framework = arduino
platform_packages =
    platformio/framework-arduinoteensy@1.159.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.110301.0
    platformio/tool-teensy@1.162.0
build_flags = -Wall -Wextra -iquote${PROJECT_DIR}/build/m11-config
build_src_filter = +<supervisor.c> +<balance.c> +<estimator.c> +<kinematics.c> +<m11/moteus.c> +<m11/layer.c> +<locomotion/learned.c> +<locomotion/locomotion.c> +<locomotion/parity.c> +<teensy_m11.cpp>
