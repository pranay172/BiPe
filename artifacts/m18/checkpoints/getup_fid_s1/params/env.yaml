          hip_pretension_per_span_N: 62.5
          hip_pretension_basis: 'Phase D4 (user decisions 13 October 2026): 60 ->
            62.5 N per span. At 60 N the forward_0p3 thigh hip-belt slack path fell
            to factor 1.98 at dt/2 with the knee stop B thigh; 65 N was tried first
            and dipped the hip pod bearing to 1.68 at dt/2 (the skid strike peak is
            trajectory sensitive, 250-469 N), so 62.5 N was adopted after it kept
            factor 2 in all five forward_0p3 ensemble runs (slack 2.06-2.33). Gates
            Light Power & Precision manual p65: Formula 1 (1.21 Q/d) gives 57 N; Table
            8 general static tension for 2MGT GT3 6 mm is 10 lb (44 N) per span, and
            registration (positioning) drives start at 1.5-2.0 x Table 8 (67-89 N);
            Table 6 rated working tension at 20 grooves 39 lb (173 N), breaking strength
            125 lb. The extra pull raises the hip bearings'' pretension load by 4
            percent (in the plant''s bearing friction and the falls screen).'
          basis: 'M9 Gates basis: Table 6 2MGT 6 mm cord EA proxy 16903 N (9 mm: x1.5),
            two spans, k = 2 EA r^2 / span at the output pulley. Hip (20T:80T, 2MR-192
            96T belt, 41.53 mm centres, 36.9 mm span; phase D4 14 October 2026, was
            95T at 40.5 mm): cord 594.4 N m/rad. Knee (40T:40T, 70 mm centres): cord
            117.4 N m/rad. Range 0.2..1.2 x cord and nominal 0.589 x cord, both as
            adopted in M9. Lash: the M9 tangential lash 0.05..0.2 mm (nominal 0.11
            mm) at each output pulley radius. Damping keeps the M9 hip belt time constant
            (0.025 / 300 s). Pretension per span is the M9 value. All assumptions
            until a drive is measured.'
          source: https://www.gates.com/content/dam/documents-library/catalogs/light-power-and-precision-manual.pdf
        friction:
          ball_bearing_mu: 0.0015
          ball_bearing_basis: SKF simplified frictional moment M = 0.5 mu P d for
            deep groove ball bearings (mu 0.0015); hip 6704 at its 20 mm bore; the
            knee-drive joint's 688A inner-shaft bearings (8 mm bore) are lumped at
