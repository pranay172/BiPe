            inboard face (0.046), knee_drive_a2 at the groove mid-depth in the knee
            80T pulley''s inboard face (0.0065), knee_angle at the arc-slot groove
            mid-depth (0.0775, phase D4 option B). The pad force |M|/r passes through
            the shaft''s bearing pair.'
          joints:
            thigh_a1:
              radius_m: 0.02
              area_m2: 2.28e-05
              thickness_m: 0.008
              y_m: 0.046
            knee_drive_a2:
              radius_m: 0.02
              area_m2: 2.28e-05
              thickness_m: 0.008
              y_m: 0.0065
            knee_angle:
              radius_m: 0.0145
