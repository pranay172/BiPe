          basis: '30/40/60 are the M10 extended, nominal and crouched poses; 60 (72
            mm hip height) is the lowest operating posture (user decision 13 October
            2026: with the 10 mm skid candidate the body keeps about 20 mm clearance).
            65 (60 mm, 18 mm body clearance without the skid) and the 45 mm sit (3
            mm) are resting poses, not operating postures; the B3 sit search is clean
            down to 45 mm.'
